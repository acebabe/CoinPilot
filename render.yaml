databases:
  - name: coinpilot-db
    databaseName: coinpilot_d87z
    user: ace
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: coinpilot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coinpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
