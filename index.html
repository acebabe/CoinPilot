<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CoinPilot</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <meta name="description" content="CoinPilot - Off-chain ledger demo: credits, signup/login, admin controls, notifications, and Exchange Integration stub." />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="app">
      <nav class="nav">
        <div class="brand">CoinPilot</div>
        <div class="links">
          <a href="#/">Home</a>
          <a href="#/dashboard">Dashboard</a>
          <a href="#/notifications">Notifications</a>
          <a href="#/exchange">Exchange</a>
          <a href="#/admin" id="admin-link" class="hidden">Admin</a>
          <button id="login-btn" class="btn small">Login</button>
        </div>
      </nav>

      <main id="page"></main>

      <footer class="footer">Built for demo: centralized non-withdrawable credits • Exchange Integration (Coinbase stub)</footer>
    </div>

    <!-- Login modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-panel">
        <h3 id="modal-title">Login</h3>
        <form id="auth-form">
          <label>Email <input id="email" type="email" required /></label>
          <label>Password <input id="password" type="password" required /></label>
          <div class="form-row">
            <button type="submit" class="btn">Submit</button>
            <button type="button" id="cancel" class="btn alt">Cancel</button>
          </div>
        </form>
        <p class="small">Demo accounts: user@example.com / password — admin@example.com / adminpass</p>
      </div>
    </div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
